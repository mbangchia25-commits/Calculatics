<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculatics — Live Football Scores & Forecasts</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    header { max-width: 800px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: #38bdf8; margin: 0; }
    .card { background: #1e293b; border-radius: 10px; padding: 16px; max-width: 800px; margin: 0 auto 12px; }
    .meta { font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 8px; }
    .live { color: #ef4444; font-weight: bold; }
    .teams { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .forecast-bar { display: flex; gap: 8px; font-size: 13px; background: #0f172a; padding: 8px; border-radius: 6px; }
    .tip { background: #0284c7; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .msg { max-width: 800px; margin: 20px auto; background: #1e293b; padding: 16px; border-radius: 10px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Calculatics</h1>
    <span id="last-updated">Loading...</span>
  </header>
  <div id="matches"><div class="msg">Loading matches...</div></div>

  <script>
    async function loadMatches() {
      const container = document.getElementById('matches');
      try {
        const res = await fetch('forecasts.json?t=' + Date.now());
        if (!res.ok) throw new Error('Could not load forecasts.json - Status: ' + res.status);
        const data = await res.json();
        document.getElementById('last-updated').textContent = data.updated_at ? 'Updated: ' + new Date(data.updated_at).toLocaleString() : 'Updated';

        if (!data.matches || data.matches.length === 0) {
          container.innerHTML = '<div class="msg">No matches scheduled right now. Check back soon.</div>';
          return;
        }

        container.innerHTML = data.matches.map(m => {
          const isLive = m.status === 'IN_PLAY' || m.status === 'PAUSED';
          const score = (m.score && m.score.home !== null) ? m.score.home + ' - ' + m.score.away : 'vs';
          const f = m.forecast || { home_prob: 0, draw_prob: 0, away_prob: 0, tip: '-' };
          const dateStr = m.utcDate ? new Date(m.utcDate).toLocaleString() : m.status;
          return '<div class="card"><div class="meta"><span>' + m.competition + '</span><span class="' + (isLive ? 'live' : '') + '">' + (isLive ? '● LIVE' : dateStr) + '</span></div><div class="teams"><span>' + m.homeTeam + '</span><span>' + score + '</span><span>' + m.awayTeam + '</span></div><div class="forecast-bar"><span>1: <strong>' + f.home_prob + '%</strong></span><span>X: <strong>' + f.draw_prob + '%</strong></span><span>2: <strong>' + f.away_prob + '%</strong></span><span style="margin-left:auto;">Tip: <span class="tip">' + f.tip + '</span></span></div></div>';
        }).join('');
      } catch (err) {
        document.getElementById('last-updated').textContent = 'Error loading data';
        container.innerHTML = '<div class="msg">Error: ' + err.message + '<br><br>Please refresh the page.</div>';
      }
    }
    loadMatches();
    setInterval(loadMatches, 60000);
  </script>
</body>
</html>
