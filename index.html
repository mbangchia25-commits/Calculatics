<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculatics. — Calculated. Not Guessed.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#F2F5FA;color:#0F1B2D;padding-bottom:110px}
.top{background:#0B5CFF;color:#fff;padding:14px 14px 10px;position:sticky;top:0;z-index:20}
.topPred{background:#C81E1E;color:#fff;padding:14px 14px 10px;position:sticky;top:0;z-index:20}
.topGreen{background:#2E9E4A;color:#fff;padding:14px 14px 10px;position:sticky;top:0;z-index:20}
.logo{font-size:26px;font-weight:900}.slogan{font-size:11px;opacity:.9;letter-spacing:1px;text-transform:uppercase}
.search{margin-top:10px;background:#fff;border-radius:999px;overflow:hidden}
.search input{width:100%;border:none;outline:none;padding:11px 14px;font-size:15px}
.narrate{background:#0F1B2D;color:#fff;border-radius:12px;padding:10px 12px;margin:10px 12px 0;font-size:12px;line-height:1.6}
.narrate b{color:#7ED321}.narrate .step{color:#FFD166}.progress{height:8px;background:#2A3A55;border-radius:999px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:#0B5CFF;transition:width .3s}
.logLine{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catTitle{font-size:22px;font-weight:800;text-align:center;padding:14px 0 8px}
.catGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.catCard{border-radius:18px;padding:22px 10px 18px;text-align:center;cursor:pointer;border:3px solid #E6EBF2;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.catCard b{display:block;font-size:16px;margin-top:14px}.catIcon{font-size:44px}
.dateRow{display:flex;gap:8px;overflow:auto;padding:10px 12px}
.datePill{min-width:78px;background:#EDEFF2;border-radius:16px;padding:10px 8px;text-align:center;cursor:pointer;flex-shrink:0}
.datePill b{display:block;font-size:13px}.datePill small{color:#6B7A90}
.datePill.active{background:#0B5CFF;color:#fff}.datePill.active small{color:#D9E6FF}
.tabsTop{display:flex;gap:8px;overflow:auto;padding:6px 12px;background:#fff;border-bottom:1px solid #E6EBF2}
.tBtn{padding:9px 14px;border-radius:999px;background:#F2F5FA;border:1px solid #E6EBF2;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.tBtn.active{background:#0B5CFF;color:#fff;border-color:#0B5CFF}
.predHeader{display:flex;justify-content:space-between;padding:10px 12px;font-size:12px;color:#333;font-weight:700;background:#fff;border-bottom:1px solid #eee}
.predRow{background:#fff;border-radius:12px;margin:0 12px 10px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer}
.predTeams{flex:1.4}.predTeams b{color:#C81E1E;font-size:14px;display:block}.predTeams small{color:#999}
.prob{font-size:14px;white-space:nowrap}.prob b{color:#000}
.predCircle{width:32px;height:32px;border-radius:50%;background:#FFB300;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.coef{background:#fff;border:1px solid #eee;border-radius:8px;padding:6px 8px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.liveBadge{border:1px solid #FF2D2D;color:#FF2D2D;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}
.sureCard{background:#1A1A2E;color:#fff;border-radius:14px;margin:0 12px 12px;overflow:hidden;cursor:pointer}
.sureTop{background:#12122A;padding:12px;display:flex;justify-content:space-between;font-size:13px}
.sureBody{padding:14px;display:flex;justify-content:space-between;align-items:center}
.surePick{background:#0B5CFF;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700}
.sureOdds{background:#7ED321;color:#000;padding:10px 14px;border-radius:10px;font-weight:800}
.topPredCard{background:#fff;border-radius:18px;margin:0 12px 14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}
.topPredLeague{background:#F2F2F2;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.tipBox{border:1px solid #D9E6FF;border-radius:12px;padding:10px;text-align:center;color:#666;font-size:13px;margin-top:10px}
.freeVipCard{background:#F2F0F5;color:#1A0A2E;border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;font-weight:700;margin-bottom:10px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #0B5CFF;display:flex;justify-content:space-around;padding:10px 0 12px;z-index:40}
.bottom button{border:none;background:none;text-align:center;font-size:11px;font-weight:700;color:#6B7A90}.bottom button.active{color:#0B5CFF}
.page{display:none}.page.active{display:block}
.detailBox{background:#fff;border-radius:12px;padding:12px;margin-top:10px}
.statRow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.statBar{flex:1;height:8px;background:#EAF2FF;border-radius:999px;overflow:hidden;display:flex}
.detailBtn{background:#0B5CFF;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800;width:100%;margin-top:10px}
.retryBtn{background:#0B5CFF;color:#fff;border:none;padding:12px 18px;border-radius:999px;font-weight:800;margin-top:10px}
</style>
</head>
<body>
<header class="top" id="mainHeader">
<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="logo">Calculatics.</div><div class="slogan">Calculated. Not Guessed.</div></div><div style="font-size:12px;text-align:right" id="topCount">Ready — tap anything</div></div>
<div class="search"><input id="searchInput" oninput="doSearch(this.value)" placeholder="Search team, league, country..."></div>
</header>
<div class="narrate" id="narrateBox">
<div class="logLine" id="narrateLine1">▶ <span class="step">Starting Calculatics...</span></div>
<div class="logLine" id="narrateLine2">Waiting to connect...</div>
<div class="logLine" id="narrateLine3">0 games loaded so far.</div>
<div class="progress"><div id="progressBar" style="width:5%"></div></div>
<div style="margin-top:6px"><button onclick="loadAll()" style="background:#7ED321;border:none;padding:6px 12px;border-radius:999px;font-weight:800">↻ Retry</button> <span id="narrateTime" style="color:#AAB">0s</span></div>
</div>
<div class="dateRow" id="dateRow"></div>
<div id="catSection">
<div class="catTitle">Categories</div>
<div class="catGrid">
<div class="catCard" onclick="openCat('Home/Away')" style="background:#E6F4EA;border-color:#C8E6C9"><div class="catIcon">📈</div><b style="color:#2E9E4A">Home/Away</b></div>
<div class="catCard" onclick="openCat('Daily 2 Odds')" style="background:#EAF2FF;border-color:#BFD8FF"><div class="catIcon">↔️</div><b style="color:#0B5CFF">Daily 2 Odds</b></div>
<div class="catCard" onclick="openCat('Daily Bonus')" style="background:#FFF8DC;border-color:#F0E6B8"><div class="catIcon">⭐</div><b style="color:#E6A800">Daily Bonus</b></div>
<div class="catCard" onclick="openCat('Over/Under')" style="background:#FFF0E6;border-color:#FFD8B8"><div class="catIcon">📄</div><b style="color:#E67E00">Over/Under</b></div>
<div class="catCard" onclick="openCat('BTTS')" style="background:#F5EFEF;border-color:#D8C8C8"><div class="catIcon">🏠</div><b style="color:#6B4A4A">BTTS</b></div>
<div class="catCard" onclick="openCat('Extra Picks')" style="background:#EAF2FF;border-color:#BFD8FF"><div class="catIcon">➕</div><b style="color:#5A7A8A">Extra Picks</b></div>
</div>
</div>
