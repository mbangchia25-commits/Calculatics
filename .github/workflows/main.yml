name: Update Calculatics Forecasts

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Calculatics Forecast Script
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_forecasts.py

      - name: Commit and push updated forecasts
        run: |
          git config --global user.name "Calculatics Bot"
          git config --global user.email "bot@calculatics.app"
          git add forecasts.json
          git commit -m "Update match forecasts" || exit 0
          git push
